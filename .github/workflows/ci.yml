name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend: unit tests ──────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Vitest unit tests
        run: npm test

  # ─── TypeScript type-check ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

  # ─── Soroban smart contract: build + test ──────────────────────────────────
  contract:
    name: Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build contract WASM
        working-directory: contracts/divify-splitter
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run contract tests
        working-directory: contracts/divify-splitter
        run: cargo test

  # ─── Deploy check ────────────────────────────────────────────────────────
  deploy-check:
    name: Deploy Ready
    needs: [frontend, typecheck, contract]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: All checks passed
        run: echo "All CI checks passed — ready to deploy to Vercel"
